name: Update GitHub Stats Cards

on:
  schedule:
    - cron: "0 0 * * *"   # corre uma vez por dia, à meia-noite UTC
  workflow_dispatch:        # permite correr manualmente
  push:
    branches:
      - main

jobs:
  update-stats:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=transparent&title_color=01403A&icon_color=01403A&text_color=333333&border_color=D9D9D9&hide_border=false
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=transparent&title_color=01403A&text_color=333333&border_color=D9D9D9&hide_border=false
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: actualizar cartões de estatísticas do GitHub" || exit 0
          git push
